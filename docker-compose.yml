services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: fhs
            POSTGRES_PASSWORD: fhs_password
            POSTGRES_DB: field_health_survey
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'

volumes:
    pgdata:
